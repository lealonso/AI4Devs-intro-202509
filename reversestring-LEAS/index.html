<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reverse String</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Styles -->
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <main class="vh-100 d-flex align-items-center justify-content-center bg-light">
      <div class="container-sm">
        <div class="card shadow-sm">
          <div class="card-body">
            <h1 class="card-title h3 mb-4 text-center">Reverse String</h1>

            <form id="reverse-form" class="row g-3" novalidate>
              <div class="col-12">
                <label for="text-input" class="form-label">Reverse String</label>
                <input
                  id="text-input"
                  type="text"
                  class="form-control"
                  placeholder="Enter your text here"
                  autocomplete="off"
                />
              </div>

              <div class="col-12">
                <button id="reverse-btn" type="submit" class="btn btn-primary w-100 d-none">
                  Reverse
                </button>
              </div>
            </form>

            <hr class="my-4" />

            <div id="result-wrap" class="alert alert-secondary d-none" role="status" aria-live="polite">
              <span class="fw-semibold">Result:</span>
              <span id="result-text" class="ms-2"></span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Script -->
    <script src="./index.js"></script>
  </body>
</html>
