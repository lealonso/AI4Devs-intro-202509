<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Reverse String</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./index.css" />
  <script defer src="./index.js"></script>
</head>
<body>
  <main class="page d-grid place-center">
    <div class="container">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="card-title h4 mb-4">Reverse String</h1>

          <div class="mb-3">
            <label for="textInput" class="form-label">Reverse String</label>
            <input
              type="text"
              id="textInput"
              class="form-control"
              placeholder="Enter your text here"
              autocomplete="off"
            />
            <div class="form-text text-muted mt-2">
              Example: typing <code>AI4Devs</code> shows <code>sveD4IA</code>.
            </div>
          </div>

          <hr class="my-4" />

          <div>
            <span class="fw-semibold">Result:</span>
            <p id="result" class="display-6 mt-2" aria-live="polite"></p>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
